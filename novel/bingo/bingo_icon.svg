        <path d="M 5.04 457.7 C 175.04 544.36, 549 409.7, 651 443.7 S 1126.96 241.04, 1200.96 361.04" stroke="#f6f6f1" stroke-width="3" opacity=".95"><animate attributeName="opacity" values=".86;1;.86" dur="5.1s" repeatCount="indefinite"/></path>
      </g>
  <g id="shadow" transform="translate(9 10)" fill="#0d1116" opacity=".22" filter="url(#shadowBlur)"><use href="#glyph-0" transform="translate(178 392) rotate(-2) scale(1.01 1.01)"/><use href="#glyph-1" transform="translate(456 392) rotate(2) scale(-1.01 1.01)"/><use href="#glyph-2" transform="translate(744 392) rotate(-2) scale(1.01 -1.01)"/><use href="#glyph-3" transform="translate(1024 392) rotate(2) scale(1.01 1.01)"/></g>
