      <circle cx="448.69" cy="355.89" r="48.96" fill="#ffffff" opacity=".94"><animateTransform attributeName="transform" type="translate" values="0 0;4 -2;0 0" dur="5.4s" repeatCount="indefinite"/></circle>
      <circle cx="775.07" cy="413.22" r="48.96" fill="#10151a" opacity=".94"><animateTransform attributeName="transform" type="translate" values="0 0;-4 2;0 0" dur="5.4s" repeatCount="indefinite"/></circle>
      <rect x="0" y="0" width="100%" height="100%" fill="url(#sheenGrad)" opacity=".34"><animateTransform attributeName="transform" type="translate" values="-18 0;18 -14;-18 0" dur="6.4s" repeatCount="indefinite"/></rect>
    </g>
  <g id="inner-stroke" fill="none" stroke="#e5e8eb" stroke-width="1.35" opacity=".5"><use href="#glyph-0" transform="translate(178 392) rotate(-2) scale(1.01 1.01)"/><use href="#glyph-1" transform="translate(456 392) rotate(2) scale(-1.01 1.01)"/><use href="#glyph-2" transform="translate(744 392) rotate(-2) scale(1.01 -1.01)"/><use href="#glyph-3" transform="translate(1024 392) rotate(2) scale(1.01 1.01)"/></g>
  
      <g id="inner-trails" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 63.04 297.7 C 491 377.7, 615 397.7, 1138.96 477.7" stroke="#232a31" stroke-width="2.2" opacity=".48" stroke-dasharray="8 12"><animate attributeName="stroke-dashoffset" values="0;-36" dur="4.8s" repeatCount="indefinite"/></path>
