<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="構思賓果 陰陽相生">
  <title>構思賓果｜陰陽相生橫式藝術字</title>
  <desc>黑白互生、鏡像構圖與太極旋流的平衡字面；透明背景，黑白互生，字位帶有鏡像構圖與太極旋流。</desc>
  <defs>
    <linearGradient id="faceBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9f7f2"/>
      <stop offset="48%" stop-color="#b7bcc4"/>
      <stop offset="100%" stop-color="#11161c"/>
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="52%" stop-color="#666f78"/>
      <stop offset="100%" stop-color="#1b2128"/>
    </linearGradient>
    <linearGradient id="sheenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".8"/>
      <stop offset="52%" stop-color="#f7fbff" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <filter id="blurBig" x="-28%" y="-28%" width="156%" height="156%"><feGaussianBlur stdDeviation="5.2"/></filter>
    <filter id="shadowBlur" x="-28%" y="-28%" width="156%" height="156%"><feGaussianBlur stdDeviation="8.2"/></filter>
    <text id="glyph-0" x="0" y="0" text-anchor="middle" dominant-baseline="central" font-family='&quot;Noto Serif CJK TC&quot;, &quot;Source Han Serif TC&quot;, &quot;Songti TC&quot;, &quot;PMingLiU&quot;, serif' font-size="250" font-weight="840">構</text><text id="glyph-1" x="0" y="0" text-anchor="middle" dominant-baseline="central" font-family='&quot;Noto Serif CJK TC&quot;, &quot;Source Han Serif TC&quot;, &quot;Songti TC&quot;, &quot;PMingLiU&quot;, serif' font-size="250" font-weight="840">思</text><text id="glyph-2" x="0" y="0" text-anchor="middle" dominant-baseline="central" font-family='&quot;Noto Serif CJK TC&quot;, &quot;Source Han Serif TC&quot;, &quot;Songti TC&quot;, &quot;PMingLiU&quot;, serif' font-size="250" font-weight="840">賓</text><text id="glyph-3" x="0" y="0" text-anchor="middle" dominant-baseline="central" font-family='&quot;Noto Serif CJK TC&quot;, &quot;Source Han Serif TC&quot;, &quot;Songti TC&quot;, &quot;PMingLiU&quot;, serif' font-size="250" font-weight="840">果</text>
    <clipPath id="lettersClip"><use href="#glyph-0" transform="translate(178 392) rotate(-2) scale(1.01 1.01)"/><use href="#glyph-1" transform="translate(456 392) rotate(2) scale(-1.01 1.01)"/><use href="#glyph-2" transform="translate(744 392) rotate(-2) scale(1.01 -1.01)"/><use href="#glyph-3" transform="translate(1024 392) rotate(2) scale(1.01 1.01)"/></clipPath>
  </defs>
  
      <g id="outer-ribbons" fill="none" stroke-linecap="round" stroke-linejoin="round">
