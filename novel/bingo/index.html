<!DOCTYPE html>

<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
<meta content="#18242c" name="theme-color"/>
<meta content="構思賓果｜小說寫作構思工具。4×4賓果、36種題目、固定／隨機／自訂賓果面與本機儲存。" name="description"/>
<meta content="website" property="og:type"/>
<meta content="構思賓果｜Stillness by Slowly" property="og:title"/>
<meta content="讓故事慢慢成形。小說構思進度、自由抽題與自訂賓果。" property="og:description"/>
<meta content="https://img.stillnessbyslowly.com/images/2026/10/f1226ede-34dd-4107-a659-da1d1db89897_%E6%A7%8B%E6%80%9D%E8%B3%93%E6%9E%9C_yin-yang_horizontal_2x.png" property="og:image"/>
<title>
   構思賓果｜Stillness by Slowly
  </title>
<link href="./bingo_icon.svg" rel="icon" type="image/svg+xml"/>
<!-- 慢慢軍火庫：直接以 HTTPS 載入，不複製零件到專案。 -->
<link href="https://lib.stillnessbyslowly.com/ui/responsive.css" rel="stylesheet"/>
<link href="https://lib.stillnessbyslowly.com/ui/confirm/confirm.css" rel="stylesheet"/>
<link href="https://lib.stillnessbyslowly.com/ui/toast.css" rel="stylesheet"/>
<link href="https://lib.stillnessbyslowly.com/effects/light/area_burst.css" rel="stylesheet"/>
<link href="https://lib.stillnessbyslowly.com/effects/light/electric_border.css" rel="stylesheet"/>
<link href="https://lib.stillnessbyslowly.com/effects/line/underline.css" rel="stylesheet"/>
<link href="https://lib.stillnessbyslowly.com/ui/custom_select.css" rel="stylesheet"/>
<!-- 宿主專案：功能必要樣式與 UI 外觀分離。 -->
<link href="./bingo.css" rel="stylesheet"/>
<link href="./bingo_style.css" rel="stylesheet"/>
<script defer="" src="https://lib.stillnessbyslowly.com/ui/custom_select.js"></script>
<script defer="" src="https://lib.stillnessbyslowly.com/data/random/random_id.js">
</script>
<script defer="" src="https://lib.stillnessbyslowly.com/data/random/random.js">
</script>
<script defer="" src="https://lib.stillnessbyslowly.com/fiction/Fiction_shuffle.js">
</script>
<script defer="" src="https://lib.stillnessbyslowly.com/fiction/Fiction_storage.js">
</script>
<script defer="" src="https://lib.stillnessbyslowly.com/Image/canvas/wrapped_text.js">
</script>
<script defer="" src="https://lib.stillnessbyslowly.com/Image/png/canvas_png.js">
</script>
<script defer="" src="https://lib.stillnessbyslowly.com/Image/png/png_download.js">
</script>
<script defer="" src="https://lib.stillnessbyslowly.com/ui/confirm/confirm.js">
</script>
<script defer="" src="https://lib.stillnessbyslowly.com/ui/toast.js">
</script>
<script defer="" src="https://lib.stillnessbyslowly.com/effects/light/area_burst.js">
</script>
<script defer="" src="./bingo.js">
</script>
<script defer="" src="./bingo_style.js">
</script>
</head>
<body>
<div class="site-wrap">
<header class="site-header">
<div class="header-inner">
<div class="brand-lockup">
<img alt="構思賓果" class="brand-art" height="760" src="./bingo_icon.svg" width="1200"/>
<h1 class="visually-hidden">
       構思賓果
      </h1>
</div>
</div>
</header>
<main class="site-main">
<div class="error-banner" hidden="" id="errorBanner" role="alert">
</div>
<section aria-label="小說與賓果管理" class="workbar">
<div class="workbar-group">
<label class="control-title" for="novelSelect">
       小說
      </label>
<div class="select-row">
<select aria-label="選擇小說" id="novelSelect">
</select>
<button aria-label="新增小說" class="icon-button slowly-underline" id="createNovel" title="新增小說" type="button">新增</button>
<button aria-label="重新命名小說" class="icon-button slowly-underline" id="renameNovel" title="重新命名小說" type="button">改名</button>
<button aria-label="刪除小說" class="icon-button icon-button-danger slowly-underline" id="deleteNovel" title="刪除小說" type="button">刪除</button>
</div>
</div>
<div aria-hidden="true" class="workbar-divider">
</div>
<div class="workbar-group">
<label class="control-title" for="boardSelect">
       賓果
      </label>
<div class="select-row">
<select aria-label="選擇賓果" id="boardSelect">
</select>
<button aria-label="新增賓果" class="icon-button slowly-underline" id="createBoard" title="新增賓果" type="button">新增</button>
<button aria-label="重新命名賓果" class="icon-button slowly-underline" id="renameBoard" title="重新命名賓果" type="button">改名</button>
<button aria-label="刪除賓果" class="icon-button icon-button-danger slowly-underline" id="deleteBoard" title="刪除賓果" type="button">刪除</button>
</div>
</div>
</section>
<section aria-live="polite" class="empty-state" id="emptyState">
<button class="primary-button slowly-underline" id="emptyAction" type="button">
      新增賓果
     </button>
</section>
<div class="workspace" hidden="" id="workspace">
<section aria-labelledby="boardTitle" class="board-panel">
<div class="board-panel-top">
<div>
<h2 class="board-title" id="boardTitle">
</h2>
</div>
<div aria-label="賓果連線數" class="board-counter">
<strong id="lineCount">
         0
        </strong>
<span>
         ／10 BINGO
        </span>
</div>
</div>
<div class="progress-info">
<span id="progressLabel">
        0 / 16
       </span>
<span id="progressPercent">
        0%
       </span>
</div>
<div aria-hidden="true" class="progress-track">
<div class="progress-fill" id="progressFill">
</div>
</div>
<div aria-label="已完成格外觀" class="completion-style-picker" role="group">
<span class="completion-style-label">完成格</span>
<button aria-pressed="true" class="completion-style-choice slowly-underline is-active" data-completion-style="normal" id="completionStyleNormal" type="button">一般</button>
<span aria-hidden="true" class="completion-style-divider">／</span>
<button aria-pressed="false" class="completion-style-choice slowly-underline" data-completion-style="electric" id="completionStyleElectric" type="button">流光</button>
</div>
<div class="board-stage" id="boardStage">
<div aria-label="構思賓果" class="bingo-grid" id="bingoGrid" role="group">
</div>
</div>
<div class="board-actions">
<button class="secondary-button slowly-underline" id="shuffleBoard" type="button">
        重新排列
       </button>
<a class="secondary-button record-link slowly-underline" hidden="" href="./record/" id="recordPageLink">構思紀錄</a>
<button class="secondary-button slowly-underline" id="exportCard" type="button">
        匯出 PNG
       </button>
<button class="quiet-button slowly-underline" id="anotherBoard" type="button">
        新增賓果
       </button>
</div>
</section>
</div>
</main>
</div>
<div aria-live="polite" class="app-toast" id="toastMessage" role="status">
</div>
<dialog aria-labelledby="nameDialogTitle" class="app-dialog" id="nameDialog">
<form id="nameForm" novalidate="">
<div class="dialog-head">
<h2 id="nameDialogTitle">
</h2>
<button aria-label="關閉" class="dialog-close slowly-underline" id="nameCancelIcon" type="button">關閉</button>
</div>
<label class="field-label" for="nameInput" id="nameLabel">
     名稱
    </label>
<input autocomplete="off" id="nameInput" maxlength="90" name="name" placeholder="名稱" type="text"/>
<div class="dialog-actions">
<button class="quiet-button slowly-underline" id="nameCancel" type="button">
      取消
     </button>
<button class="primary-button slowly-underline" id="nameSubmit" type="submit">
      儲存
     </button>
</div>
</form>
</dialog>
<dialog aria-labelledby="boardDialogTitle" class="app-dialog board-dialog" id="boardDialog">
<form id="boardForm" novalidate="">
<div class="dialog-head">
<h2 id="boardDialogTitle">
      新增一張構思賓果
     </h2>
<button aria-label="關閉" class="dialog-close slowly-underline" id="boardCancelIcon" type="button">關閉</button>
</div>
<label class="field-label" for="newBoardName">
     賓果名稱（選填）
    </label>
<input autocomplete="off" id="newBoardName" maxlength="90" name="boardName" placeholder="選填" type="text"/>
<fieldset class="mode-fieldset">
<legend class="field-label">
      賓果類型
     </legend>
<div class="mode-options">
<label class="mode-option">
<input checked="" name="boardMode" type="radio" value="fixed"/>
<span class="mode-option-body slowly-underline">
<strong>
         固定賓果
        </strong>
</span>
</label>
<label class="mode-option">
<input name="boardMode" type="radio" value="random"/>
<span class="mode-option-body slowly-underline">
<strong>
         隨機賓果
        </strong>
</span>
</label>
<label class="mode-option">
<input name="boardMode" type="radio" value="custom"/>
<span class="mode-option-body slowly-underline">
<strong>
         自訂賓果
        </strong>
</span>
</label>
<label class="mode-option">
<input name="boardMode" type="radio" value="special"/>
<span class="mode-option-body slowly-underline">
<strong>
         特殊賓果
        </strong>
</span>
</label>
</div>
</fieldset>
<div class="custom-editor" hidden="" id="customEditor">
<div class="custom-head">
<strong>
       題目
      </strong>
<span id="customCounter" role="status">
       尚未選擇
      </span>
</div>
<div class="custom-topic-groups" id="customTopicGroups">
</div>
</div>
<div class="dialog-actions">
<button class="quiet-button slowly-underline" id="boardCancel" type="button">
      取消
     </button>
<button class="primary-button slowly-underline" id="boardSubmit" type="submit">
      產生賓果
     </button>
</div>
</form>
</dialog>
<dialog aria-labelledby="previewDialogTitle" class="app-dialog preview-dialog" id="previewDialog">
<div class="dialog-head">
<h2 id="previewDialogTitle">PNG 預覽</h2>
<button aria-label="關閉" class="dialog-close slowly-underline" id="previewCloseIcon" type="button">關閉</button>
</div>
<div class="preview-stage">
<img alt="展示卡預覽" class="preview-image" id="previewImage"/>
</div>
<div class="dialog-actions">
<button class="quiet-button slowly-underline" id="previewCancel" type="button">取消</button>
<button class="primary-button slowly-underline" id="previewDownload" type="button">下載 PNG</button>
</div>
</dialog>
</body>
</html>
