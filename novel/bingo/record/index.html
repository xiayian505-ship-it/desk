<!DOCTYPE html>

<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
<meta content="#17232b" name="theme-color"/>
<meta content="構思賓果的構思紀錄頁。" name="description"/>
<title>構思紀錄｜Stillness by Slowly</title>
<link href="../bingo_icon.svg" rel="icon" type="image/svg+xml"/>
<!-- 共用功能以軍火庫 HTTPS 絕對網址載入。 -->
<link href="https://lib.stillnessbyslowly.com/ui/responsive.css" rel="stylesheet"/>
<link href="https://lib.stillnessbyslowly.com/effects/line/underline.css" rel="stylesheet"/>
<link href="https://lib.stillnessbyslowly.com/ui/custom_select.css" rel="stylesheet"/>
<link href="https://lib.stillnessbyslowly.com/effects/stage/portal_wipe.css" rel="stylesheet"/>
<link href="https://lib.stillnessbyslowly.com/effects/reveal/fade_up.css" rel="stylesheet"/>
<link href="https://lib.stillnessbyslowly.com/effects/scroll/progress.css" rel="stylesheet"/>
<link href="./record.css" rel="stylesheet"/>
<link href="./record_style.css" rel="stylesheet"/>
<script defer="" src="https://lib.stillnessbyslowly.com/ui/custom_select.js"></script>
<script defer="" src="https://lib.stillnessbyslowly.com/data/random/random_id.js"></script>
<script defer="" src="https://lib.stillnessbyslowly.com/data/random/random.js"></script>
<script defer="" src="https://lib.stillnessbyslowly.com/fiction/Fiction_shuffle.js"></script>
<script defer="" src="https://lib.stillnessbyslowly.com/fiction/Fiction_storage.js"></script>
<!-- 重用賓果核心題庫與資料存取，不建立第二套 Key／UID 規則。 -->
<script defer="" src="https://lib.stillnessbyslowly.com/ui/accordion/accordion.js"></script>
<script defer="" src="../bingo.js"></script>
<script defer="" src="./record.js"></script>
<script defer="" src="https://lib.stillnessbyslowly.com/effects/stage/portal_wipe.js"></script>
<script defer="" src="https://lib.stillnessbyslowly.com/effects/reveal/auto_reveal.js"></script>
<script defer="" src="https://lib.stillnessbyslowly.com/effects/scroll/progress.js"></script>
<script defer="" src="./record_style.js"></script>
</head>
<body>
<div class="slowly-scroll-progress" aria-hidden="true"></div>
<div class="record-shell">
<header class="record-header slowly-fade-up" data-slowly-reveal>
<h1>構思紀錄</h1>
<a class="back-link slowly-underline" href="../" id="backToBingo">返回賓果</a>
</header>
<main>
<div class="record-error" hidden="" id="recordError" role="alert"></div>
<section aria-label="選擇作品與賓果" class="record-controls slowly-fade-up" data-slowly-reveal>
<label class="record-control">
<span>小說</span>
<select aria-label="選擇小說" id="recordNovelSelect"></select>
</label>
<label class="record-control">
<span>賓果</span>
<select aria-label="選擇賓果" id="recordBoardSelect"></select>
</label>
</section>
<section class="record-workspace slowly-fade-up" data-slowly-reveal hidden="" id="recordWorkspace">
<section class="record-card">
<h2 class="record-board-title" id="recordBoardTitle"></h2>
<div aria-label="構思清單" class="record-items" data-slowly-accordion="" id="recordItems"></div>
</section>
</section>
<section class="record-editor" hidden="" id="recordEditor">
<div class="editor-header">
<div>
<span class="editor-group" id="recordTopicGroup"></span>
<h2 id="recordTopicTitle">構思內容</h2>
</div>
<span aria-live="polite" id="recordSaveStatus" role="status"></span>
</div>
<label class="sr-only" for="recordContent">構思內容</label>
<textarea id="recordContent" placeholder="寫下構思…" spellcheck="true"></textarea>
<div class="record-editor-actions">
<button class="record-text-action slowly-underline" id="recordCancel" type="button">取消</button>
<button class="record-text-action slowly-underline" id="recordConfirm" type="button">確認</button>
</div>
</section>
<section class="record-empty" hidden="" id="recordEmpty">
<a class="back-link slowly-underline" href="../" id="backToBingoEmpty">返回賓果</a>
</section>
</main>
</div>
</body>
</html>
