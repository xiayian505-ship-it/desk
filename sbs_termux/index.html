<!DOCTYPE html>
<html lang="zh-Hant">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   慢慢終端機
  </title>
  <link href="https://lib.stillnessbyslowly.com/ui/responsive.css" rel="stylesheet"/>
  <link href="https://lib.stillnessbyslowly.com/ui/toast.css" rel="stylesheet"/>
  <link href="sbs_termux.css" rel="stylesheet"/>
  <link href="sbs_termux_style.css" rel="stylesheet"/>
  <link href="css/command_output.css" rel="stylesheet"/>
 </head>
 <body data-page="home">
  <div class="shell">
   <header>
    <h1>
     慢慢終端機
    </h1>
   </header>
   <nav aria-label="主要分頁" class="tabs" role="tablist">
    <button aria-selected="true" data-tab="intro" role="tab" type="button">
     慢慢看一下
    </button>
    <button aria-selected="false" data-tab="categories" role="tab" type="button">
     指令分類
    </button>
    <button aria-selected="false" data-tab="all" role="tab" type="button">
     全部指令
    </button>
   </nav>
   <main>
    <section class="panel" data-panel="intro" role="tabpanel">
    </section>
    <section class="panel" data-panel="categories" hidden="" role="tabpanel">
     <div class="section">
      <h2>
       指令分類
      </h2>
      <div class="category-list" id="category-list">
      </div>
     </div>
    </section>
    <section class="panel" data-panel="all" hidden="" role="tabpanel">
     <div class="section">
      <h2>
       全部指令
      </h2>
      <div class="search-wrap">
       <label class="field">
        搜尋指令
        <input autocomplete="off" id="command-search" placeholder="輸入指令名稱或分類" type="search"/>
       </label>
      </div>
      <div id="all-command-list">
      </div>
     </div>
    </section>
    <div hidden="" id="command-workspace">
     <section aria-label="目前專案" class="section">
      <div class="project-bar">
       <div>
        <span class="muted">
         目前專案
        </span>
        <strong data-current-project="">
         尚未選取專案
        </strong>
        <code data-current-path="">
         請先建立或選取專案
        </code>
       </div>
       <div>
        <label class="field" for="project-select">
         切換專案
         <select id="project-select">
         </select>
        </label>
       </div>
      </div>
      <div class="project-actions">
       <button id="add-project" type="button">
        建立專案
       </button>
       <button id="edit-project" type="button">
        編輯
       </button>
       <button id="remove-project" type="button">
        刪除
       </button>
       <button id="copy-path" type="button">
        複製路徑
       </button>
       <button id="make-directory" type="button">
        建立目錄 → 加入選取
       </button>
      </div>
     </section>
     <section aria-label="已選指令" class="section">
      <div class="section-heading">
       <h2>
        已選指令
       </h2>
       <span class="muted" id="selection-count">
        0 / 5
       </span>
      </div>
      <div id="selected-items">
      </div>
      <div class="project-actions">
       <button id="clear-selection" type="button">
        清空選取
       </button>
       <button class="primary" id="generate-commands" type="button">
        產生指令
       </button>
      </div>
     </section>
     <section aria-label="指令產生框" class="output-shell">
      <div class="section-heading">
       <h2>
        指令產生框
       </h2>
       <span class="muted" id="output-count">
        0 / 5
       </span>
      </div>
      <p class="muted">
       每條可單獨複製，也可按順序一次複製全部。網站不會執行指令。
      </p>
      <div id="output-items">
      </div>
      <div class="output-actions">
       <button id="clear-output" type="button">
        清除產生結果
       </button>
       <button class="primary" disabled="" id="copy-all" type="button">
        複製全部
       </button>
      </div>
     </section>
    </div>
    <div aria-live="polite" class="slowly-toast" id="toast" role="status">
    </div>
   </main>
   <footer>
    慢 慢 | Stillness by Slowly
   </footer>
  </div>
  <dialog id="project-dialog">
   <form id="project-form">
    <div class="item-head">
     <h2 id="dialog-title">
      建立專案
     </h2>
     <button aria-label="關閉" id="close-dialog" type="button">
      ×
     </button>
    </div>
    <label class="field">
     專案名稱
     <input id="project-name" maxlength="60" required=""/>
    </label>
    <label class="field">
     Termux 專案路徑
     <input id="project-directory" placeholder="例如 ~/storage/shared/Projects/demo" required="" spellcheck="false"/>
    </label>
    <label class="field">
     備註（選填）
     <input id="project-description"/>
    </label>
    <p class="muted">
     建立專案只會儲存網站紀錄。要在 Termux 建立實體目錄，請使用「建立目錄 → 加入選取」。
    </p>
    <div class="dialog-actions">
     <button id="cancel-dialog" type="button">
      取消
     </button>
     <button class="primary" type="submit">
      儲存專案
     </button>
    </div>
   </form>
  </dialog>
  <script defer="" src="https://lib.stillnessbyslowly.com/ui/clipboard/clipboard_copy.js">
  </script>
  <script defer="" src="https://lib.stillnessbyslowly.com/ui/toast.js">
  </script>
  <script defer="" src="js/toast.js">
  </script>
  <script defer="" src="commands/commands_termux.js">
  </script>
  <script defer="" src="commands/commands_files.js">
  </script>
  <script defer="" src="commands/commands_git.js">
  </script>
  <script defer="" src="commands/commands_index.js">
  </script>
  <script defer="" src="js/storage.js">
  </script>
  <script defer="" src="js/projects.js">
  </script>
  <script defer="" src="js/command_catalog.js">
  </script>
  <script defer="" src="js/command_builder.js">
  </script>
  <script defer="" src="js/command_selection.js">
  </script>
  <script defer="" src="js/clipboard.js">
  </script>
  <script defer="" src="js/navigation.js">
  </script>
  <script defer="" src="js/project_ui.js">
  </script>
  <script defer="" src="js/command_ui.js">
  </script>
  <script defer="" src="js/command_output.js">
  </script>
  <script defer="" src="js/group_page.js">
  </script>
  <script defer="" src="sbs_termux_style.js">
  </script>
  <script defer="" src="sbs_termux.js">
  </script>
 </body>
</html>
