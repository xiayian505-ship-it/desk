<!DOCTYPE html>
<html lang="zh-Hant">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <meta content="#11161c" name="theme-color"/>
  <title>
   慢慢終端機｜Termux 任務指令
  </title>
  <!-- 共用軍火庫：透過 HTTPS 直接載入，不複製零件到專案。 -->
  <link href="https://lib.stillnessbyslowly.com/ui/responsive.css" rel="stylesheet"/>
  <link href="https://lib.stillnessbyslowly.com/ui/custom_select.css" rel="stylesheet"/>
  <link href="https://lib.stillnessbyslowly.com/ui/toast.css" rel="stylesheet"/>
  <link href="https://lib.stillnessbyslowly.com/ui/confirm/confirm.css" rel="stylesheet"/>
  <link href="sbs_termux_v2.css" rel="stylesheet"/>
  <link href="sbs_termux_v2_style.css" rel="stylesheet"/>
  <link href="sbs_termux_v2_interaction.css" rel="stylesheet"/>
  <script defer="" src="https://lib.stillnessbyslowly.com/ui/custom_select.js">
  </script>
  <script defer="" src="https://lib.stillnessbyslowly.com/ui/clipboard/clipboard_copy.js">
  </script>
  <script defer="" src="https://lib.stillnessbyslowly.com/ui/toast.js">
  </script>
  <script defer="" src="https://lib.stillnessbyslowly.com/ui/confirm/confirm.js">
  </script>
  <script defer="" src="sbs_termux_v2.js">
  </script>
  <script defer="" src="sbs_termux_v2_style.js">
  </script>
  <script defer="" src="sbs_termux_v2_interaction.js">
  </script>
 </head>
 <body>
  <div class="shell">
   <header class="site-header">
    <div>
     <h1>
      慢慢終端機
     </h1>
    </div>
   </header>
   <main>
    <section aria-label="選擇任務" class="panel">
     <nav aria-label="選擇任務" class="tabs">
      <button aria-selected="true" class="tab" data-task="setup" role="tab" type="button">
       開始之前
      </button>
      <button aria-selected="false" class="tab" data-task="upload" role="tab" type="button">
       本機 &rarr; GitHub
      </button>
      <button aria-selected="false" class="tab" data-task="download" role="tab" type="button">
       GitHub &rarr; 本機
      </button>
     </nav>
     <form data-form="setup" id="setup-form">
      <p class="helper">
       貼上 GitHub 專案網址，解析後只需選擇手機裡的存放位置。已經下載過的專案，不用重新下載。
      </p>
      <div class="form-grid">
       <label class="field">
        GitHub 專案網址
        <input autocomplete="off" id="setup-repo" inputmode="url" placeholder="https://github.com/帳號/專案名稱" required="" type="url"/>
        <button class="parse-btn" id="setup-repo-parse" type="button">
         解析網址
        </button>
        <small aria-live="polite" id="setup-repo-parsed">
        </small>
       </label>
       <label class="field">
        下載後的資料夾名稱（通常不用改）
        <input autocomplete="off" id="setup-folder" placeholder="解析網址後自動填入"/>
       </label>
       <label class="field full">
        要把專案放在手機的哪個資料夾？
        <div class="path-input">
         <span class="path-prefix">
          ~/storage/shared/
         </span>
         <input autocomplete="off" data-shared-path="" id="setup-location" placeholder="github_projects" required=""/>
        </div>
        <small>
         只填 shared/ 後面的部分；例如 github_projects。下載後會自動建立專案資料夾。
        </small>
       </label>
      </div>
      <div class="actions">
       <button class="primary" type="submit">
        產生完整準備流程
       </button>
      </div>
     </form>
     <form data-form="upload" hidden="" id="upload-form">
      <p class="helper">
       已經在手機裡的專案，要把修改上傳到 GitHub。只需告訴工具專案放在哪裡，以及這次要上傳哪些資料夾。
      </p>
      <div class="form-grid">
       <label class="field full">
        手機裡的專案資料夾在哪裡？
        <div class="path-input">
         <span class="path-prefix">
          ~/storage/shared/
         </span>
         <input autocomplete="off" data-shared-path="" id="upload-location" placeholder="github_projects/desk" required=""/>
        </div>
        <small>
         只填 shared/ 後面的部分。例如 github_projects/desk；不知道位置時，在 Termux 進入專案後輸入 pwd。
        </small>
       </label>
       <label class="field full">
        這次只上傳哪個資料夾？（可留空）
        <textarea id="upload-subpaths" placeholder="sbs_termux" spellcheck="false"></textarea>
        <small>
         留空會上傳整個專案；只上傳其中的資料夾，就填資料夾名稱，例如 sbs_termux。不要填 GitHub 帳號或專案名稱。
        </small>
       </label>
       <label class="field full">
        這次修改要留下什麼紀錄？
        <input autocomplete="off" id="upload-message" maxlength="180" required="" value="Update project"/>
       </label>
      </div>
      <div class="actions">
       <button class="primary" type="submit">
        產生完整上傳流程
       </button>
      </div>
     </form>
     <form data-form="download" hidden="" id="download-form">
      <p class="helper">
       還沒下載到手機，選「第一次下載」；手機裡已經有這個專案，選「更新已有的專案」。
      </p>
      <div class="form-grid">
       <label class="field">
        我要做的事
        <select aria-label="下載方式" data-slowly-select="" id="download-mode">
         <option value="clone">
          第一次下載到手機
         </option>
         <option value="pull">
          更新手機裡已有的專案
         </option>
        </select>
       </label>
       <label class="field full">
        要把專案下載到手機的哪個資料夾？
        <span id="download-location-label">
         要存放 repo 的父目錄
        </span>
        <div class="path-input">
         <span class="path-prefix">
          ~/storage/shared/
         </span>
         <input autocomplete="off" data-shared-path="" id="download-location" placeholder="github_projects" required=""/>
        </div>
        <small>
         只填 shared/ 後面的部分。第一次下載填上層資料夾；更新已有專案填專案資料夾。
        </small>
       </label>
       <label class="field" data-download-mode="clone">
        GitHub 專案網址
        <input autocomplete="off" id="download-repo" inputmode="url" placeholder="https://github.com/帳號/專案名稱" type="url"/>
        <button class="parse-btn" id="download-repo-parse" type="button">
         解析網址
        </button>
        <small aria-live="polite" id="download-repo-parsed">
        </small>
       </label>
       <label class="field" data-download-mode="clone">
        下載後的資料夾名稱（通常不用改）
        <input autocomplete="off" id="download-folder" placeholder="解析網址後自動填入"/>
       </label>
       <label class="field" data-download-mode="pull" hidden="">
        要更新哪個版本？（通常不用改）
        <input autocomplete="off" id="download-branch" value="main"/>
       </label>
       <label class="field full" data-download-mode="pull" hidden="">
        更新後想查看哪個資料夾？（可留空）
        <textarea id="download-subpaths" placeholder="例如 work/roster
docs/notes" spellcheck="false"></textarea>
        <small>
         Git pull 會更新整個 repo；這裡的子目錄只用於更新後查看。
        </small>
       </label>
      </div>
      <div class="actions">
       <button class="primary" type="submit">
        產生完整下載流程
       </button>
      </div>
     </form>
     <p aria-live="polite" class="error" id="error" role="alert">
     </p>
    </section>
    <section aria-labelledby="results-title" class="panel" hidden="" id="results">
     <div class="result-header">
      <h2 id="results-title">
       你的操作流程
      </h2>
      <span aria-live="polite" class="progress" id="progress">
      </span>
     </div>
     <p class="helper">
      勾選只記錄你在這個畫面上的進度，不代表指令已執行成功。每一步都要自行核對結果。
     </p>
     <div class="actions result-actions">
      <button class="secondary" id="copy-all" type="button">
       複製完整流程（文字）
      </button>
      <button class="secondary" id="reset-checks" type="button">
       清除勾選
      </button>
     </div>
     <ol class="steps" id="steps">
     </ol>
    </section>
   </main>
   <footer>
    慢 慢 ｜ Stillness by Slowly
   </footer>
  </div>
  <div aria-live="polite" class="slowly-toast" id="toast" role="status">
  </div>
 </body>
</html>
