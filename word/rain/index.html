<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f7f5">
  <meta name="description" content="雨系藝術字｜慢慢藝術字。1～4 字、直式與橫式、SVG、透明 PNG 及書封 PNG。">
  <title>雨系藝術字｜慢慢藝術字</title>

  <!-- 作品特效繼續留在各系列；文字生成核心使用軍火庫 HTTPS 絕對路徑。 -->
  <link rel="stylesheet" href="rain.css">
  <link rel="stylesheet" href="../word_style.css">
  <script defer src="https://lib.stillnessbyslowly.com/Image/png/canvas_png.js"></script>
  <script defer src="https://lib.stillnessbyslowly.com/Image/png/png_download.js"></script>
  <script defer src="https://lib.stillnessbyslowly.com/effects/background/rain.js"></script>
  <script defer src="https://lib.stillnessbyslowly.com/data/blob/blob_url.js"></script>
  <script defer src="https://lib.stillnessbyslowly.com/component/text_generator/text_generator_component.js"></script>
  <script defer src="https://lib.stillnessbyslowly.com/component/text_generator/text_generator_core.js"></script>
  <script defer src="https://lib.stillnessbyslowly.com/component/text_generator/text_generator_horizontal_component.js"></script>
  <script defer src="rain_template.js"></script>
  <script defer src="rain.js"></script>
  <script defer src="rain_horizontal.js"></script>
  <script defer src="rain_style.js"></script>
</head>
<body class="word-rain">
  <div class="word-workbench">
    <header class="word-heading">
      <h1><a href="https://desk.stillnessbyslowly.com/word/index.html" aria-label="雨系藝術字，返回慢慢藝術字主頁">雨系藝術字<span class="title-period" aria-hidden="true">.</span></a></h1>
    </header>

    <main class="word-workspace">
      <form class="word-editor" id="art-form" novalidate>
        <div class="word-orientation orientation-switch" role="group" aria-label="文字排列方式">
          <button type="button" class="word-text-button" data-orientation="vertical" aria-pressed="true">直式</button>
          <button type="button" class="word-text-button" data-orientation="horizontal" aria-pressed="false">橫式</button>
        </div>

        <div class="word-field-heading">
          <label for="art-text">輸入文字</label>
          <output id="char-count" for="art-text" aria-live="polite">4 / 4</output>
        </div>
        <input class="word-input" id="art-text" name="art-text" type="text"
          value="雨你相遇" placeholder="例如：聽雨"
          autocomplete="off" spellcheck="false">
        <div class="word-samples" aria-label="範例文字">
            <button type="button" class="word-text-button" data-example="雨你相遇">雨你相遇</button>
            <button type="button" class="word-text-button" data-example="聽雨">聽雨</button>
            <button type="button" class="word-text-button" data-example="雨">雨</button>
        </div>
      </form>

      <section class="word-preview-section" aria-labelledby="word-preview-title">
        <h2 id="word-preview-title" class="word-section-title">作品預覽</h2>
        <div class="word-preview preview-section">
          <div class="word-preview-frame preview-frame">
            <div class="transparency-grid" aria-hidden="true"></div>
            <canvas id="page-rain" class="page-rain" aria-hidden="true"></canvas>
            <img id="art-image" class="art-image" alt="雨系藝術字預覽" width="840" height="1200">
          </div>
        </div>
      </section>

      <section class="word-exports" aria-labelledby="word-exports-title">
        <h2 id="word-exports-title" class="word-section-title">下載作品</h2>
        <div class="word-downloads">
          <button type="button" id="download-svg" class="word-text-button">SVG</button>
          <button type="button" id="download-png" class="word-text-button">透明 PNG</button>
          <button type="button" id="download-cover" class="word-text-button">角角者書封 PNG</button>
        </div>
        <p id="download-status" class="word-download-status" role="status" aria-live="polite"></p>
        <!-- 現有 UI 會更新這些規格值；不佔用作品頁面的說明空間。 -->
        <div class="word-visually-hidden" aria-hidden="true">
          <span id="png-spec">1680 × 2400</span>
        </div>
      </section>
    </main>

    <footer class="sbs-signature" aria-label="Stillness by Slowly">
      <span class="sbs-signature-mark">慢 慢</span>
      <span class="sbs-signature-separator" aria-hidden="true">|</span>
      <span class="sbs-signature-name">Stillness by Slowly</span>
    </footer>
  </div>
</body>
</html>
