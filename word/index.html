<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f7f5">
  <meta name="description" content="慢慢藝術字｜Stillness by Slowly。依 A～Z 英文系列代號尋找藝術字產生器，閱讀字型授權提醒，製作自己的文字作品。">
  <title>慢慢藝術字</title>

  <!-- Framework 只提供骨架；軍火庫零件都經 HTTPS 絕對網址載入。 -->
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/ui/responsive.css">
  <link rel="stylesheet" href="https://framework.stillnessbyslowly.com/line/outline/outline.css">
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/ui/tabs/tabs.css">
  <link rel="stylesheet" href="./index.css">
  <link rel="stylesheet" href="./index_style.css">

  <script defer src="https://lib.stillnessbyslowly.com/fiction/Fiction_search.js"></script>
  <script defer src="https://lib.stillnessbyslowly.com/fiction/Fiction_paginate.js"></script>
  <script defer src="https://lib.stillnessbyslowly.com/ui/tabs/tabs.js"></script>
  <script defer src="https://lib.stillnessbyslowly.com/state/tree_selection.js"></script>
  <script defer src="./index_data.js"></script>
  <script defer src="./index.js"></script>
  <script defer src="./index_style.js"></script>
  <script defer src="./index_content.js"></script>
</head>
<body>
  <main class="outline-page word-page">
    <header class="page-heading">
      <div class="heading-copy">
        <h1>慢慢藝術字</h1>
        <p class="tagline" id="wordTagline"></p>
      </div>
    </header>

    <div class="outline-tabs-shell" id="wordTabs" data-slowly-tabs>
      <nav class="view-tabs alphabet-nav" id="wordTabList" role="tablist" aria-label="藝術字英文系列分頁">
        <button type="button" role="tab" data-view-target="directory" aria-selected="true">慢慢看</button>
        <!-- A～Z 由 index_style.js 補上，不需要二十六張 HTML。 -->
      </nav>

      <section class="view-panel" data-view-panel="directory" aria-label="慢慢看">
        <div class="directory-count">
          <p class="section-side-note" id="collectionCount"></p>
        </div>

        <div class="search-area">
          <input
            id="wordSearch"
            aria-label="搜尋藝術字"
            type="search"
            placeholder="名稱、英文代號或關鍵字，例如：雷電、star…"
            autocomplete="off"
            spellcheck="false"
            enterkeyhint="search"
          >
          <p class="search-hint" id="searchHint"></p>
          <p class="search-status" id="searchStatus" role="status" aria-live="polite"></p>
          <div class="search-results" id="searchResults"></div>
        </div>

        <!-- 入口由 viewer_content.json 的 modes 清單建立；一個檢視模式對應一張入口卡片。 -->
        <div id="viewerEntries"></div>

        <section class="notes" aria-labelledby="notesTitle">
          <div class="section-heading notes-heading">
            <div>
              <h2 id="notesTitle"></h2>
            </div>
          </div>
          <!-- 提醒內容由 index_notes.json 的 notes.items 建立。 -->
          <div class="notice-list" id="noticeList"></div>
        </section>
      </section>

      <div id="letterPanels"></div>
    </div>

    <footer class="sbs-signature" aria-label="Stillness by Slowly">
      <span class="sbs-signature-mark">慢 慢</span>
      <span class="sbs-signature-separator" aria-hidden="true">|</span>
      <span class="sbs-signature-name">Stillness by Slowly</span>
    </footer>
    <p class="boot-message" id="bootMessage" role="alert" hidden></p>
  </main>
</body>
</html>
